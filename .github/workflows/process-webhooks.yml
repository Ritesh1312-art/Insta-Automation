name: Process InstaDM jobs
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Run authenticated worker
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --max-time 45 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/process-webhooks"
